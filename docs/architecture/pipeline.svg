<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 832" role="img" aria-labelledby="t-pipeline"><title id="t-pipeline">Workout request pipeline from coach request to plan with provenance</title><style>
.bg{fill:var(--d-bg,#F3EFE7)}.n{fill:var(--d-node,#FFFFFF)}.p{fill:var(--d-pnode,#F3EFE7)}
.l{fill:var(--d-llm,#BFD0FF)}.i{fill:var(--d-inv,#0A0A0A)}.g{fill:#2741E8}
.t{font:600 15px 'Bricolage Grotesque',system-ui,sans-serif;fill:var(--d-ink,#0A0A0A)}.s{font:400 13px 'Bricolage Grotesque',system-ui,sans-serif;fill:var(--d-muted,#4A4A4A)}
.lb{font:400 12px 'Bricolage Grotesque',system-ui,sans-serif;fill:var(--d-muted,#4A4A4A)}.hd{font:700 13px 'Bricolage Grotesque',system-ui,sans-serif;fill:var(--d-muted,#4A4A4A)}
.ti{fill:var(--d-on-inv,#F3EFE7)}.si{fill:var(--d-on-inv-muted,#CFCFCF)}.tg{fill:#FFFFFF}
.e{stroke:var(--d-muted,#4A4A4A);stroke-width:2;fill:none}.ah{fill:var(--d-muted,#4A4A4A)}
.d{stroke:var(--d-muted,#4A4A4A);stroke-width:1.5;fill:none;stroke-dasharray:6 6}
</style><defs><marker id="a-pipeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="960" height="832"/><rect class="n" x="260" y="16" width="440" height="56" rx="16"/><text class="t" x="480.0" y="40" text-anchor="middle">Coach request</text><text class="s" x="480.0" y="60" text-anchor="middle">“Lower body, avoid her knee, 30 min”</text><rect class="n" x="260" y="104" width="440" height="56" rx="16"/><text class="t" x="480.0" y="128" text-anchor="middle">Router</text><text class="s" x="480.0" y="148" text-anchor="middle">rules, plus intent from the extraction call</text><text class="lb" x="728" y="126" text-anchor="start">compose, lookup, analyze,</text><text class="lb" x="728" y="143" text-anchor="start">or analyze then compose</text><rect class="n" x="260" y="192" width="210" height="72" rx="16"/><text class="t" x="365.0" y="224" text-anchor="middle">Rules extractor</text><text class="s" x="365.0" y="244" text-anchor="middle">SKOS labels, fuzzy match</text><rect class="l" x="490" y="192" width="210" height="72" rx="16"/><text class="t" x="595.0" y="224" text-anchor="middle">LLM extractor</text><text class="s" x="595.0" y="244" text-anchor="middle">in parallel, 2 s timeout</text><text class="lb" x="728" y="214" text-anchor="start">Union: the model can add</text><text class="lb" x="728" y="231" text-anchor="start">caution, never remove it</text><rect class="g" x="16" y="192" width="190" height="72" rx="16"/><text class="t tg" x="111.0" y="224" text-anchor="middle">Ask the coach</text><text class="s tg" x="111.0" y="244" text-anchor="middle">a concern it can't place</text><path class="e" d="M258 228H208" marker-end="url(#a-pipeline)"/><text class="lb" x="232" y="220" text-anchor="middle">blocks</text><rect class="n" x="260" y="296" width="440" height="56" rx="16"/><text class="t" x="480.0" y="320" text-anchor="middle">Constraints</text><text class="s" x="480.0" y="340" text-anchor="middle">injuries, care-team rules, request, readiness</text><text class="lb" x="728" y="318" text-anchor="start">from KG2 and today's</text><text class="lb" x="728" y="335" text-anchor="start">check-in or messages</text><rect class="i" x="260" y="384" width="440" height="64" rx="16"/><text class="t ti" x="480.0" y="412" text-anchor="middle">Safety filter</text><text class="s si" x="480.0" y="432" text-anchor="middle">graph traversal, no model involved</text><text class="lb" x="728" y="406" text-anchor="start">every exclusion keeps its</text><text class="lb" x="728" y="423" text-anchor="start">rule, source and graph path</text><rect class="n" x="260" y="480" width="440" height="56" rx="16"/><text class="t" x="480.0" y="504" text-anchor="middle">Scorer</text><text class="s" x="480.0" y="524" text-anchor="middle">goals, history, journey stage, preferences</text><text class="lb" x="728" y="502" text-anchor="start">ranks only what is</text><text class="lb" x="728" y="519" text-anchor="start">already safe</text><rect class="n" x="260" y="568" width="210" height="72" rx="16"/><text class="t" x="365.0" y="600" text-anchor="middle">Deterministic builder</text><text class="s" x="365.0" y="620" text-anchor="middle">offline floor, under 50 ms</text><rect class="l" x="490" y="568" width="210" height="72" rx="16"/><text class="t" x="595.0" y="600" text-anchor="middle">LLM composer</text><text class="s" x="595.0" y="620" text-anchor="middle">picks from safe IDs only</text><text class="lb" x="728" y="590" text-anchor="start">falls back to the builder</text><text class="lb" x="728" y="607" text-anchor="start">on timeout or bad output</text><rect class="n" x="260" y="672" width="440" height="56" rx="16"/><text class="t" x="480.0" y="696" text-anchor="middle">Validator</text><text class="s" x="480.0" y="716" text-anchor="middle">always runs, whichever builder won</text><text class="lb" x="728" y="694" text-anchor="start">drops unknown IDs and unsafe text,</text><text class="lb" x="728" y="711" text-anchor="start">swaps picks, clamps doses, fits time</text><rect class="n" x="260" y="760" width="440" height="56" rx="16"/><text class="t" x="480.0" y="784" text-anchor="middle">Plan + provenance</text><text class="s" x="480.0" y="804" text-anchor="middle">sets, reps, rest, RPE, and why for each</text><path class="e" d="M480 72V102" marker-end="url(#a-pipeline)"/><path class="e" d="M480 352V382" marker-end="url(#a-pipeline)"/><path class="e" d="M480 448V478" marker-end="url(#a-pipeline)"/><path class="e" d="M480 728V758" marker-end="url(#a-pipeline)"/><path class="e" d="M480 160V176H365V190" marker-end="url(#a-pipeline)"/><path class="e" d="M480 176H595V190" marker-end="url(#a-pipeline)"/><path class="e" d="M480 536V552H365V566" marker-end="url(#a-pipeline)"/><path class="e" d="M480 552H595V566" marker-end="url(#a-pipeline)"/><path class="e" d="M365 264V280H595V264"/><path class="e" d="M480 280V294" marker-end="url(#a-pipeline)"/><path class="e" d="M365 640V656H595V640"/><path class="e" d="M480 656V670" marker-end="url(#a-pipeline)"/></svg>
