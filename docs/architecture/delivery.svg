<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t-delivery"><title id="t-delivery">Delivery pipeline from commit to the live site</title><style>
.bg{fill:var(--d-bg,#F3EFE7)}.n{fill:var(--d-node,#FFFFFF)}.p{fill:var(--d-pnode,#F3EFE7)}
.l{fill:var(--d-llm,#BFD0FF)}.i{fill:var(--d-inv,#0A0A0A)}.g{fill:#2741E8}
.t{font:600 15px 'Bricolage Grotesque',system-ui,sans-serif;fill:var(--d-ink,#0A0A0A)}.s{font:400 13px 'Bricolage Grotesque',system-ui,sans-serif;fill:var(--d-muted,#4A4A4A)}
.lb{font:400 12px 'Bricolage Grotesque',system-ui,sans-serif;fill:var(--d-muted,#4A4A4A)}.hd{font:700 13px 'Bricolage Grotesque',system-ui,sans-serif;fill:var(--d-muted,#4A4A4A)}
.ti{fill:var(--d-on-inv,#F3EFE7)}.si{fill:var(--d-on-inv-muted,#CFCFCF)}.tg{fill:#FFFFFF}
.e{stroke:var(--d-muted,#4A4A4A);stroke-width:2;fill:none}.ah{fill:var(--d-muted,#4A4A4A)}
.d{stroke:var(--d-muted,#4A4A4A);stroke-width:1.5;fill:none;stroke-dasharray:6 6}
</style><defs><marker id="a-delivery" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="960" height="300"/><rect class="n" x="16" y="16" width="212" height="88" rx="16"/><text class="t" x="122.0" y="48" text-anchor="middle">Commit</text><text class="s" x="122.0" y="68" text-anchor="middle">ruff, gitleaks,</text><text class="s" x="122.0" y="85" text-anchor="middle">conventional message</text><rect class="n" x="252" y="16" width="212" height="88" rx="16"/><text class="t" x="358.0" y="48" text-anchor="middle">Push</text><text class="s" x="358.0" y="68" text-anchor="middle">LLM-free tests</text><text class="s" x="358.0" y="85" text-anchor="middle">(pre-push hook)</text><rect class="l" x="488" y="16" width="212" height="88" rx="16"/><text class="t" x="594.0" y="48" text-anchor="middle">MR pipeline</text><text class="s" x="594.0" y="68" text-anchor="middle">lint, tests, build,</text><text class="s" x="594.0" y="85" text-anchor="middle">golden set, real models</text><rect class="i" x="724" y="16" width="220" height="88" rx="16"/><text class="t ti" x="834.0" y="48" text-anchor="middle">Eval gate</text><text class="s si" x="834.0" y="68" text-anchor="middle">all cases pass, floors met,</text><text class="s si" x="834.0" y="85" text-anchor="middle">no drop vs baseline</text><rect class="n" x="16" y="196" width="212" height="88" rx="16"/><text class="t" x="122.0" y="228" text-anchor="middle">Merge to main</text><text class="s" x="122.0" y="248" text-anchor="middle">protected branch,</text><text class="s" x="122.0" y="265" text-anchor="middle">pipeline must pass</text><rect class="n" x="252" y="196" width="212" height="88" rx="16"/><text class="t" x="358.0" y="228" text-anchor="middle">Deploy job</text><text class="s" x="358.0" y="248" text-anchor="middle">rsync, write keys,</text><text class="s" x="358.0" y="265" text-anchor="middle">restart, health check</text><rect class="n" x="488" y="196" width="212" height="88" rx="16"/><text class="t" x="594.0" y="228" text-anchor="middle">Live site</text><text class="s" x="594.0" y="248" text-anchor="middle">198-199-77-33</text><text class="s" x="594.0" y="265" text-anchor="middle">.sslip.io</text><path class="e" d="M228 60H250" marker-end="url(#a-delivery)"/><path class="e" d="M464 60H486" marker-end="url(#a-delivery)"/><path class="e" d="M700 60H722" marker-end="url(#a-delivery)"/><path class="e" d="M834 104V150H122V194" marker-end="url(#a-delivery)"/><path class="e" d="M228 240H250" marker-end="url(#a-delivery)"/><path class="e" d="M464 240H486" marker-end="url(#a-delivery)"/><text class="lb" x="478" y="142" text-anchor="middle">all jobs run on the self-hosted Mac runner</text></svg>
