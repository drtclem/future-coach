.d{stroke:var(--d-muted,#4A4A4A);stroke-width:1.5;fill:none;stroke-dasharray:6 6}
</style><defs><marker id="a-system" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="960" height="460"/><rect class="n" x="16" y="180" width="150" height="72" rx="16"/><text class="t" x="91.0" y="212" text-anchor="middle">Coach</text><text class="s" x="91.0" y="232" text-anchor="middle">browser</text><rect class="d" x="196" y="16" width="520" height="428" rx="24"/><text class="hd" x="216" y="44">DigitalOcean droplet, Ubuntu 24.04</text><rect class="n" x="216" y="180" width="140" height="72" rx="16"/><text class="t" x="286.0" y="212" text-anchor="middle">Caddy</text><text class="s" x="286.0" y="232" text-anchor="middle">HTTPS, coach login</text><rect class="n" x="386" y="64" width="310" height="260" rx="24"/><text class="t" x="410" y="96">FastAPI app</text><text class="s" x="410" y="116">one process, served by uvicorn</text><rect class="p" x="406" y="132" width="270" height="28" rx="14"/><text class="s" x="541" y="151" text-anchor="middle">Router, resolver, safety filter</text><rect class="p" x="406" y="166" width="270" height="28" rx="14"/><text class="s" x="541" y="185" text-anchor="middle">Scorer, composer, validator</text><rect class="p" x="406" y="200" width="270" height="28" rx="14"/><text class="s" x="541" y="219" text-anchor="middle">Copilot tools, grounding check</text><rect class="p" x="406" y="234" width="270" height="28" rx="14"/><text class="s" x="541" y="253" text-anchor="middle">Member intake and signals</text><rect class="p" x="406" y="268" width="270" height="28" rx="14"/><text class="s" x="541" y="287" text-anchor="middle">Dashboard (built React files)</text><rect class="n" x="386" y="348" width="148" height="76" rx="16"/><text class="t" x="460.0" y="382" text-anchor="middle">Oxigraph</text><text class="s" x="460.0" y="402" text-anchor="middle">KG1 + KG2, in-process</text><rect class="n" x="548" y="348" width="148" height="76" rx="16"/><text class="t" x="622.0" y="382" text-anchor="middle">Event log</text><text class="s" x="622.0" y="402" text-anchor="middle">append-only JSONL</text><rect class="l" x="760" y="64" width="184" height="64" rx="16"/><text class="t" x="852.0" y="92" text-anchor="middle">Anthropic</text><text class="s" x="852.0" y="112" text-anchor="middle">primary, via LiteLLM</text><rect class="l" x="760" y="152" width="184" height="64" rx="16"/><text class="t" x="852.0" y="180" text-anchor="middle">OpenAI</text><text class="s" x="852.0" y="200" text-anchor="middle">fallback, via LiteLLM</text><rect class="n" x="760" y="264" width="184" height="64" rx="16"/><text class="t" x="852.0" y="292" text-anchor="middle">Langfuse</text><text class="s" x="852.0" y="312" text-anchor="middle">traces and scores</text><path class="e" d="M166 216H214" marker-end="url(#a-system)"/><path class="e" d="M356 216H384" marker-end="url(#a-system)"/><path class="e" d="M460 324V346" marker-end="url(#a-system)"/><path class="e" d="M622 324V346" marker-end="url(#a-system)"/><path class="e" d="M696 96H758" marker-end="url(#a-system)"/><path class="e" d="M696 184H758" marker-end="url(#a-system)"/><path class="e" d="M696 296H758" marker-end="url(#a-system)"/></svg>
