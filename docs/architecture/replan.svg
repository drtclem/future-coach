<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="t-replan"><title id="t-replan">Member data flow: a message is stored, changes readiness, and re-plans today's session in the background</title><style>
.bg{fill:var(--d-bg,#F3EFE7)}.n{fill:var(--d-node,#FFFFFF)}.p{fill:var(--d-pnode,#F3EFE7)}
.l{fill:var(--d-llm,#BFD0FF)}.i{fill:var(--d-inv,#0A0A0A)}.g{fill:#2741E8}
.t{font:600 15px 'Bricolage Grotesque',system-ui,sans-serif;fill:var(--d-ink,#0A0A0A)}.s{font:400 13px 'Bricolage Grotesque',system-ui,sans-serif;fill:var(--d-muted,#4A4A4A)}
.lb{font:400 12px 'Bricolage Grotesque',system-ui,sans-serif;fill:var(--d-muted,#4A4A4A)}.hd{font:700 13px 'Bricolage Grotesque',system-ui,sans-serif;fill:var(--d-muted,#4A4A4A)}
.ti{fill:var(--d-on-inv,#F3EFE7)}.si{fill:var(--d-on-inv-muted,#CFCFCF)}.tg{fill:#FFFFFF}
.e{stroke:var(--d-muted,#4A4A4A);stroke-width:2;fill:none}.ah{fill:var(--d-muted,#4A4A4A)}
.d{stroke:var(--d-muted,#4A4A4A);stroke-width:1.5;fill:none;stroke-dasharray:6 6}
</style><defs><marker id="a-replan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="960" height="340"/><rect class="n" x="16" y="16" width="208" height="96" rx="16"/><text class="t" x="120.0" y="52" text-anchor="middle">Member message</text><text class="s" x="120.0" y="72" text-anchor="middle">“slept 4 hours,</text><text class="s" x="120.0" y="89" text-anchor="middle">only 20 min today”</text><rect class="n" x="256" y="16" width="208" height="96" rx="16"/><text class="t" x="360.0" y="52" text-anchor="middle">Intake</text><text class="s" x="360.0" y="72" text-anchor="middle">sleep 4 h, one-off cause,</text><text class="s" x="360.0" y="89" text-anchor="middle">20 min available</text><rect class="n" x="496" y="16" width="208" height="96" rx="16"/><text class="t" x="600.0" y="52" text-anchor="middle">Event log and KG2</text><text class="s" x="600.0" y="72" text-anchor="middle">stored as observations,</text><text class="s" x="600.0" y="89" text-anchor="middle">nothing overwritten</text><rect class="n" x="736" y="16" width="208" height="96" rx="16"/><text class="t" x="840.0" y="52" text-anchor="middle">Signals</text><text class="s" x="840.0" y="72" text-anchor="middle">readiness low:</text><text class="s" x="840.0" y="89" text-anchor="middle">RPE cap 6, volume 0.6</text><rect class="g" x="16" y="208" width="208" height="96" rx="16"/><text class="t tg" x="120.0" y="244" text-anchor="middle">Reply at once</text><text class="s tg" x="120.0" y="264" text-anchor="middle">“Got it, today's session</text><text class="s tg" x="120.0" y="281" text-anchor="middle">will fit in 20 min.”</text><rect class="l" x="496" y="208" width="208" height="96" rx="16"/><text class="t" x="600.0" y="244" text-anchor="middle">Background re-plan</text><text class="s" x="600.0" y="264" text-anchor="middle">same pipeline,</text><text class="s" x="600.0" y="281" text-anchor="middle">same safety gate</text><rect class="n" x="736" y="208" width="208" height="96" rx="16"/><text class="t" x="840.0" y="244" text-anchor="middle">Plan v2 + diff</text><text class="s" x="840.0" y="264" text-anchor="middle">the coach sees what</text><text class="s" x="840.0" y="281" text-anchor="middle">changed and why</text><path class="e" d="M224 64H254" marker-end="url(#a-replan)"/><path class="e" d="M464 64H494" marker-end="url(#a-replan)"/><path class="e" d="M704 64H734" marker-end="url(#a-replan)"/><path class="e" d="M360 112V156H120V206" marker-end="url(#a-replan)"/><text class="lb" x="240" y="148" text-anchor="middle">immediately</text><path class="e" d="M840 112V176H600V206" marker-end="url(#a-replan)"/><text class="lb" x="720" y="168" text-anchor="middle">if a plan exists today</text><path class="e" d="M704 256H734" marker-end="url(#a-replan)"/></svg>
