<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="t-graph"><title id="t-graph">Knowledge graph model, worked example: why the goblet squat is excluded for Jordan's knee</title><style>
.bg{fill:var(--d-bg,#F3EFE7)}.n{fill:var(--d-node,#FFFFFF)}.p{fill:var(--d-pnode,#F3EFE7)}
.l{fill:var(--d-llm,#BFD0FF)}.i{fill:var(--d-inv,#0A0A0A)}.g{fill:#2741E8}
.t{font:600 15px 'Bricolage Grotesque',system-ui,sans-serif;fill:var(--d-ink,#0A0A0A)}.s{font:400 13px 'Bricolage Grotesque',system-ui,sans-serif;fill:var(--d-muted,#4A4A4A)}
.lb{font:400 12px 'Bricolage Grotesque',system-ui,sans-serif;fill:var(--d-muted,#4A4A4A)}.hd{font:700 13px 'Bricolage Grotesque',system-ui,sans-serif;fill:var(--d-muted,#4A4A4A)}
.ti{fill:var(--d-on-inv,#F3EFE7)}.si{fill:var(--d-on-inv-muted,#CFCFCF)}.tg{fill:#FFFFFF}
.e{stroke:var(--d-muted,#4A4A4A);stroke-width:2;fill:none}.ah{fill:var(--d-muted,#4A4A4A)}
.d{stroke:var(--d-muted,#4A4A4A);stroke-width:1.5;fill:none;stroke-dasharray:6 6}
</style><defs><marker id="a-graph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="960" height="640"/><rect class="n" x="16" y="16" width="640" height="528" rx="24"/><text class="hd" x="40" y="48">KG1: domain graph</text><rect class="n" x="672" y="16" width="272" height="528" rx="24"/><text class="hd" x="696" y="48">KG2: member graph</text><rect class="p" x="40" y="80" width="200" height="56" rx="16"/><text class="t" x="140.0" y="104" text-anchor="middle">Kettlebell Goblet Squat</text><text class="s" x="140.0" y="124" text-anchor="middle">exercise</text><rect class="p" x="40" y="200" width="200" height="56" rx="16"/><text class="t" x="140.0" y="224" text-anchor="middle">lower push: squat</text><text class="s" x="140.0" y="244" text-anchor="middle">movement pattern</text><rect class="p" x="40" y="320" width="200" height="56" rx="16"/><text class="t" x="140.0" y="344" text-anchor="middle">kettlebell, 1 needed</text><text class="s" x="140.0" y="364" text-anchor="middle">equipment requirement</text><rect class="p" x="300" y="80" width="160" height="56" rx="16"/><text class="t" x="380.0" y="104" text-anchor="middle">Stress</text><text class="s" x="380.0" y="124" text-anchor="middle">derived from the pattern</text><rect class="p" x="300" y="200" width="160" height="56" rx="16"/><text class="t" x="380.0" y="224" text-anchor="middle">knee</text><text class="s" x="380.0" y="244" text-anchor="middle">structure</text><rect class="p" x="300" y="320" width="160" height="56" rx="16"/><text class="t" x="380.0" y="344" text-anchor="middle">patellofemoral joint</text><text class="s" x="380.0" y="364" text-anchor="middle">structure</text><rect class="p" x="300" y="440" width="160" height="56" rx="16"/><text class="t" x="380.0" y="464" text-anchor="middle">PFP</text><text class="s" x="380.0" y="484" text-anchor="middle">condition (SNOMED)</text><rect class="p" x="490" y="200" width="150" height="56" rx="16"/><text class="t" x="565.0" y="224" text-anchor="middle">loaded deep flexion</text><text class="s" x="565.0" y="244" text-anchor="middle">load type</text><rect class="p" x="490" y="320" width="150" height="72" rx="16"/><text class="t" x="565.0" y="344" text-anchor="middle">PFP rule</text><text class="s" x="565.0" y="364" text-anchor="middle">recovering: downrank</text><text class="s" x="565.0" y="381" text-anchor="middle">source: Willy 2019</text><rect class="p" x="692" y="80" width="232" height="72" rx="16"/><text class="t" x="808.0" y="104" text-anchor="middle">Care-team note</text><text class="s" x="808.0" y="124" text-anchor="middle">“avoid deep knee flexion</text><text class="s" x="808.0" y="141" text-anchor="middle">under load”</text><rect class="p" x="692" y="200" width="232" height="56" rx="16"/><text class="t" x="808.0" y="224" text-anchor="middle">Member rule</text><text class="s" x="808.0" y="244" text-anchor="middle">deep flexion: exclude</text><rect class="p" x="692" y="440" width="232" height="56" rx="16"/><text class="t" x="808.0" y="464" text-anchor="middle">Left knee injury</text><text class="s" x="808.0" y="484" text-anchor="middle">Jordan, recovering</text><path class="e" d="M240 108H298" marker-end="url(#a-graph)"/><text class="lb" x="269" y="100" text-anchor="middle">stresses</text><path class="e" d="M140 136V198" marker-end="url(#a-graph)"/><text class="lb" x="148" y="172" text-anchor="start">pattern</text><path class="e" d="M140 256V318" marker-end="url(#a-graph)"/><text class="lb" x="148" y="292" text-anchor="start">requires</text><path class="e" d="M380 136V198" marker-end="url(#a-graph)"/><text class="lb" x="388" y="172" text-anchor="start">structure</text><path class="e" d="M440 136L540 198" marker-end="url(#a-graph)"/><text class="lb" x="500" y="158" text-anchor="start">load type</text><path class="e" d="M380 320V258" marker-end="url(#a-graph)"/><text class="lb" x="388" y="292" text-anchor="start">part of</text><path class="e" d="M380 440V378" marker-end="url(#a-graph)"/><text class="lb" x="388" y="412" text-anchor="start">affects</text><path class="e" d="M565 320V258" marker-end="url(#a-graph)"/><text class="lb" x="573" y="292" text-anchor="start">load type</text><path class="e" d="M565 392V455H462" marker-end="url(#a-graph)"/><text class="lb" x="573" y="428" text-anchor="start">condition</text><path class="e" d="M692 480H462" marker-end="url(#a-graph)"/><text class="lb" x="577" y="498" text-anchor="middle">instance of</text><path class="e" d="M808 152V198" marker-end="url(#a-graph)"/><text class="lb" x="816" y="180" text-anchor="start">parsed into</text><path class="e" d="M692 228H642" marker-end="url(#a-graph)"/><path class="e" d="M808 256V438" marker-end="url(#a-graph)"/><text class="lb" x="816" y="350" text-anchor="start">applies to</text><rect class="i" x="16" y="568" width="928" height="56" rx="16"/><text class="t ti" x="480.0" y="592" text-anchor="middle">Strictest tier wins</text><text class="s si" x="480.0" y="612" text-anchor="middle">The member rule (exclude) beats the condition rule (downrank), so the goblet squat is excluded, with this path as its reason.</text></svg>
