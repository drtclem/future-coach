# Future Coach CI (D18). Modeled on the clinical-copilot eval gate:
#   - lint:            pre-commit (ruff, format, yaml/json, gitleaks) on every pipeline
#   - eval_unit_tests: the LLM-free suite (safety rules, graph, API). Needs no
#                      API key, runs on drafts too, and blocks merge.
#   - frontend_build:  type-check and build the dashboard
#   - eval_golden_set: the golden set with REAL model calls (eval mode: no
#                      provider fallback, temperature 0). Non-draft MRs that
#                      touch app/eval code; retry 1 absorbs phrasing variance;
#                      blocks merge via "pipelines must succeed".
#   - eval_gate_pending: exists only on draft MRs and always fails if played,
#                      so a draft pipeline can never count as passed.
#   - deploy:          main only, after the tests: build the dashboard, rsync to
#                      the droplet as the `deploy` user, restart, health check.
#                      One-time server setup: scripts/bootstrap.sh.
#
# Runs on the self-hosted "future_coach mac" runner (shell executor) via tags,
# so it never silently falls back to shared runners.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never # avoid duplicate branch + MR pipelines
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
  auto_cancel:
    on_new_commit: interruptible

stages: [lint, test, deploy]

default:
  tags: [mac, future-coach]
  interruptible: true
  before_script:
    # The runner service starts with a minimal PATH; find a Python >= 3.12.
    - |
      for c in python3.13 python3.12 /opt/homebrew/bin/python3 "$HOME/miniconda3/bin/python3" "$HOME/anaconda3/bin/python3" /opt/anaconda3/bin/python3 /opt/miniconda3/bin/python3 python3; do
        if command -v "$c" >/dev/null 2>&1 && "$c" -c 'import sys; sys.exit(sys.version_info < (3, 12))'; then PY="$c"; break; fi
      done
      if [ -z "$PY" ]; then echo "No Python >= 3.12 found on the runner. PATH=$PATH"; exit 1; fi
      echo "Using $PY ($("$PY" --version))"
    - $PY -m venv .venv
    - .venv/bin/pip install -q --upgrade pip
    - .venv/bin/pip install -q -e "backend[dev]"

lint:
  stage: lint
  variables:
    PRE_COMMIT_HOME: $CI_PROJECT_DIR/.cache/pre-commit
  script:
    - .venv/bin/pre-commit run --all-files --show-diff-on-failure

eval_unit_tests:
  stage: test
  script:
    - cd backend && ../.venv/bin/pytest -q --junitxml=../report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

frontend_build:
  stage: test
  before_script:
    # The runner service has a minimal PATH: load nvm or Homebrew node.
    - export NVM_DIR="$HOME/.nvm"; if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; fi
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
    - node --version && npm --version
  script:
    - cd frontend && npm ci --no-audit --no-fund && npm run lint && npm run build

.eval_changes: &eval_changes
  - .gitlab-ci.yml
  - backend/**/*
  - data/**/*

eval_golden_set:
  stage: test
  variables:
    FC_EVAL_MODE: "1"
  rules:
    - if: $FORCE_FULL_EVAL == "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT != "true"
      changes: *eval_changes
  retry: 1
  script:
    - cd backend && ../.venv/bin/python -m evals.run_evals
  artifacts:
    when: always
    paths: [backend/evals/results/]

eval_gate_pending:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT == "true"
      when: manual
      allow_failure: false
  before_script: []
  script:
    - echo "BLOCKED - Draft MR pipeline; the golden set did NOT run. Mark Ready and run a new MR pipeline."
    - exit 1

deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $SSH_DEPLOY_KEY # skipped until the deploy key variable exists
  interruptible: false
  resource_group: production # one deploy at a time
  environment:
    name: production
    url: https://198-199-77-33.sslip.io
  variables:
    DEPLOY_TARGET: deploy@198.199.77.33
  before_script:
    - export NVM_DIR="$HOME/.nvm"; if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; fi
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
    # File variable from Settings > CI/CD > Variables. GitLab drops the final newline, which ssh rejects ("invalid format").
    - KEY="$CI_PROJECT_DIR/.deploy_key" && tr -d '\r' < "$SSH_DEPLOY_KEY" > "$KEY" && echo >> "$KEY" && chmod 600 "$KEY"
    # accept-new: pins the droplet's host key on first deploy, refuses if it ever changes
    - export RSYNC_RSH="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
  after_script:
    - rm -f "$CI_PROJECT_DIR/.deploy_key" # shell runner: the build dir persists on the Mac
  script:
    - cd frontend && npm ci --no-audit --no-fund && npm run build && cd ..
    - rsync -az --delete --exclude .git --exclude .venv --exclude node_modules --exclude var --exclude .env --exclude .deploy_key --exclude '.cache' --exclude '*.egg-info' ./ "$DEPLOY_TARGET:/opt/future_coach/"
    # App keys: GitLab variables are the single source; written owner-only on the server, never echoed.
    - printf 'ANTHROPIC_API_KEY=%s\nOPENAI_API_KEY=%s\nLANGFUSE_PUBLIC_KEY=%s\nLANGFUSE_SECRET_KEY=%s\nLANGFUSE_HOST=%s\n' "$ANTHROPIC_API_KEY" "$OPENAI_API_KEY" "$LANGFUSE_PUBLIC_KEY" "$LANGFUSE_SECRET_KEY" "$LANGFUSE_HOST" | $RSYNC_RSH "$DEPLOY_TARGET" 'umask 077; cat > /var/lib/future_coach/ci.env'
    - |
      $RSYNC_RSH "$DEPLOY_TARGET" 'set -e
        cd /opt/future_coach
        [ -x .venv/bin/python ] || python3 -m venv .venv
        .venv/bin/pip install -q --upgrade pip
        .venv/bin/pip install -q -e backend
        sudo /usr/bin/systemctl restart future-coach
        for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && exit 0; sleep 2; done
        echo "health check failed"; journalctl -u future-coach -n 50 --no-pager; exit 1'
